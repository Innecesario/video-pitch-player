<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161513" id="metaThemeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Video Pitch Player</title>
<meta name="description" content="Reproductor de vídeo para practicar: transpone y ralentiza la grabación sin perder calidad.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script>
  // Tema antes del primer pintado, para que no haya destello.
  (function () {
    var theme = null;
    try {
      theme = localStorage.getItem('vpp-theme');
    } catch (e) {}
    try {
      var forced = new URLSearchParams(window.location.search).get('theme');
      if (forced === 'light' || forced === 'dark') theme = forced;
    } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="shell topbar-inner">
    <span class="brand">Video Pitch Player</span>

    <div class="file" id="fileInfo" hidden>
      <span class="file-name" id="fileName"></span>
      <span class="file-meta mono" id="fileMeta"></span>
    </div>

    <div class="top-actions">
      <div class="volume">
        <button class="icon-btn" id="btnMute" type="button" aria-label="Silenciar" aria-pressed="false">
          <svg class="icon-vol-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5Z"/>
            <path d="M16 9a5 5 0 0 1 0 6"/>
            <path d="M19.4 18.4a9 9 0 0 0 0-12.8"/>
          </svg>
          <svg class="icon-vol-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5Z"/>
            <path d="m22 9-6 6"/>
            <path d="m16 9 6 6"/>
          </svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volumen">
      </div>

      <button class="icon-btn" id="btnTheme" type="button" aria-label="Cambiar a tema claro">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/><path d="M12 20v2"/>
          <path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/>
          <path d="M2 12h2"/><path d="M20 12h2"/>
          <path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
        </svg>
      </button>

      <button class="icon-btn" id="btnFullscreen" type="button" aria-label="Pantalla completa">
        <svg class="icon-fs-enter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
        <svg class="icon-fs-exit" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
          <path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
        </svg>
      </button>

      <button class="btn-secondary btn-open" id="btnOpen" type="button" aria-label="Abrir vídeo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/>
        </svg>
        <span>Abrir vídeo</span>
      </button>

      <input type="file" id="fileInput" accept="video/mp4,video/webm,video/quicktime,video/ogg,.mp4,.m4v,.webm,.mov,.ogv" hidden>
    </div>
  </div>
</header>

<main class="stage-wrap">
  <div class="shell stage-shell">
    <div class="stage" id="stage">
      <video id="video" playsinline preload="metadata"></video>

      <div class="overlay" id="overlay">
        <p class="overlay-title" id="overlayTitle">Arrastra un vídeo aquí</p>
        <p class="overlay-text" id="overlayText">o</p>
        <button class="btn-primary" id="btnOverlayOpen" type="button">Abrir vídeo</button>
        <p class="overlay-formats mono" id="overlayFormats">MP4 · WebM</p>
      </div>
    </div>
  </div>
</main>

<section class="console-wrap">
  <div class="shell">
    <div class="panel is-idle" id="console">

      <div class="timeline">
        <span class="time mono" id="timeCurrent">00:00</span>

        <div class="track" id="track" role="slider" tabindex="-1"
             aria-label="Posición del vídeo" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" aria-valuetext="00:00" aria-disabled="true">
          <div class="buffered" id="buffered"></div>
          <div class="loop" id="loopBand" hidden></div>
          <div class="mark" id="markA" hidden><span>A</span></div>
          <div class="mark" id="markB" hidden><span>B</span></div>
          <div class="played" id="played"></div>
          <div class="playhead" id="playhead"></div>
        </div>

        <span class="time end mono" id="timeTotal">00:00</span>
      </div>

      <div class="controls">

        <div class="group group-transport">
          <div class="group-head">
            <span class="label">Reproducción</span>
          </div>
          <div class="control-row transport-row">
            <button class="seek" type="button" data-skip="-10" title="Retroceder 10 segundos">−10<span>s</span></button>
            <button class="seek" type="button" data-skip="-5" title="Retroceder 5 segundos">−5<span>s</span></button>

            <button class="play" id="btnPlay" type="button" aria-label="Reproducir" data-playing="false">
              <svg class="icon-play" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z" fill="currentColor"/>
              </svg>
              <svg class="icon-pause" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
                <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
              </svg>
            </button>

            <button class="stop" id="btnStop" type="button" aria-label="Detener" title="Detener">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/>
              </svg>
            </button>

            <button class="seek" type="button" data-skip="5" title="Avanzar 5 segundos">+5<span>s</span></button>
            <button class="seek" type="button" data-skip="10" title="Avanzar 10 segundos">+10<span>s</span></button>

            <span class="divider"></span>

            <button class="loop-btn" id="btnLoop" type="button" aria-pressed="false"
                    title="Bucle A–B: marca el punto A">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
                <path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
              </svg>
              <span class="mono">A–B</span>
            </button>
          </div>
        </div>

        <div class="group group-pitch">
          <div class="group-head">
            <span class="label">Transposición</span>
            <span class="readout mono"><span id="pitchNumber">0</span><span class="unit" id="pitchUnit">semitonos</span></span>
            <button class="reset" id="btnPitchReset" type="button" hidden>Restablecer</button>
          </div>

          <div class="control-row pitch-row">
            <button class="step-btn" id="btnPitchDown" type="button" aria-label="Bajar un semitono" title="Bajar un semitono">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>

            <div class="ruler" id="ruler" role="slider" tabindex="0"
                 aria-label="Transposición en semitonos" aria-valuemin="-6" aria-valuemax="6"
                 aria-valuenow="0" aria-valuetext="0 semitonos">
              <div class="scale">
                <span class="axis"></span>

                <span class="tick long" style="left: 0%"></span>
                <span class="tick" style="left: 8.3333%"></span>
                <span class="tick" style="left: 16.6667%"></span>
                <span class="tick long" style="left: 25%"></span>
                <span class="tick" style="left: 41.6667%"></span>
                <span class="tick long" style="left: 50%"></span>
                <span class="tick" style="left: 58.3333%"></span>
                <span class="tick" style="left: 66.6667%"></span>
                <span class="tick long" style="left: 75%"></span>
                <span class="tick" style="left: 83.3333%"></span>
                <span class="tick" style="left: 91.6667%"></span>
                <span class="tick long" style="left: 100%"></span>

                <span class="tick-label" style="left: 0%">−6</span>
                <span class="tick-label" style="left: 25%">−3</span>
                <span class="tick-label" style="left: 50%">0</span>
                <span class="tick-label" style="left: 75%">+3</span>
                <span class="tick-label" style="left: 100%">+6</span>

                <span class="tick selected" id="pitchTick" style="left: 50%"></span>
              </div>
            </div>

            <button class="step-btn" id="btnPitchUp" type="button" aria-label="Subir un semitono" title="Subir un semitono">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <div class="group group-tempo">
          <div class="group-head">
            <span class="label">Velocidad</span>
            <span class="readout mono"><span id="speedNumber">100</span><span class="unit">%</span></span>
            <button class="reset" id="btnSpeedReset" type="button" hidden>Restablecer</button>
          </div>

          <div class="control-row">
            <div class="segmented" id="speedGroup" role="group" aria-label="Velocidad de reproducción">
              <button type="button" data-speed="1" aria-pressed="true">100</button>
              <button type="button" data-speed="0.95" aria-pressed="false">95</button>
              <button type="button" data-speed="0.9" aria-pressed="false">90</button>
              <button type="button" data-speed="0.85" aria-pressed="false">85</button>
              <button type="button" data-speed="0.8" aria-pressed="false">80</button>
              <button type="button" data-speed="0.75" aria-pressed="false">75</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="soundtouch.js"></script>
<script src="player.js"></script>
</body>
</html>
