<body>
  <div id="app">

    <!-- Video -->
    <div id="video-container">
      <video id="video"></video>
    </div>

    <!-- Progress -->
    <div id="progress-row">
      <span id="timeCurrent">00:00</span>
      <input type="range" id="progressBar" min="0" max="10000" value="0" step="1">
      <span id="timeTotal">00:00</span>
    </div>

    <!-- Fila superior: Open + nombre de archivo -->
    <div id="open-row">
      <button id="btnOpen">📂 Open</button>
      <input type="file" id="fileInput" accept="video/*,.mp4,.avi,.mkv,.mov,.wmv,.webm" hidden>
      <span id="fileName">No file loaded</span>
    </div>

    <!-- Fila inferior: transporte centrado -->
    <div id="transport-row">
      <div class="skip-group">
        <button id="btnBack10" title="Back 10s">⏮<span>10s</span></button>
        <button id="btnBack5"  title="Back 5s">◀<span>5s</span></button>
      </div>

      <div class="play-group">
        <button id="btnPlay">▶ Play</button>
        <button id="btnStop" title="Stop">⏹</button>
      </div>

      <div class="skip-group">
        <button id="btnFwd5"  title="Forward 5s"><span>5s</span>▶</button>
        <button id="btnFwd10" title="Forward 10s"><span>10s</span>⏭</button>
      </div>
    </div>

    <!-- Pitch + Speed -->
    <div id="bottom-row">

      <div id="pitch-block">
        <span class="label">Pitch</span>
        <button id="btnPitchDn" title="−1 semitone">♭</button>
        <span id="lblPitch">0</span>
        <span id="pitchUnit">st</span>
        <button id="btnPitchUp" title="+1 semitone">♯</button>
        <button id="btnPitchReset" title="Reset pitch">↺</button>
      </div>

      <div id="speed-block">
        <span class="label">Speed</span>
        <select id="speedSelect">
          <option value="0.75">75%</option>
          <option value="0.80">80%</option>
          <option value="0.85">85%</option>
          <option value="0.90">90%</option>
          <option value="0.95">95%</option>
          <option value="1.00" selected>100%</option>
        </select>
        <button id="btnSpeedReset" title="Reset speed to 100%">↺</button>
      </div>

    </div>
  </div>

  <script src="soundtouch.js"></script>
  <script src="player.js"></script>
</body>
</html>
